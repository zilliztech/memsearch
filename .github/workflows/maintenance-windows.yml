name: Maintenance Windows runtime

on:
  pull_request:
    paths:
      - 'src/memsearch/maintenance.py'
      - 'src/memsearch/skills.py'
      - 'tests/test_maintenance.py'
      - 'tests/test_maintenance_compat.py'
      - 'tests/test_maintenance_runner.py'
      - 'tests/test_maintenance_launch.py'
      - 'plugins/*/scripts/maintenance-runner.py'
      - '.github/workflows/maintenance-windows.yml'
  push:
    branches: [main]
    paths:
      - 'src/memsearch/maintenance.py'
      - 'src/memsearch/skills.py'
      - 'tests/test_maintenance.py'
      - 'tests/test_maintenance_compat.py'
      - 'tests/test_maintenance_runner.py'
      - 'tests/test_maintenance_launch.py'
      - 'plugins/*/scripts/maintenance-runner.py'
      - '.github/workflows/maintenance-windows.yml'

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Install core and test dependencies
        run: uv sync --locked
      - name: Check maintenance responses and native command launching
        run: uv run python -m pytest tests/test_maintenance.py tests/test_maintenance_compat.py tests/test_maintenance_runner.py tests/test_maintenance_launch.py -q
