name: Codex macOS hooks

on:
  pull_request:
    paths:
      - 'plugins/codex/**'
      - 'tests/test_codex_stop_hook_*.py'
      - 'tests/test_codex_install.py'
      - '.github/workflows/codex-macos.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/codex/**'
      - 'tests/test_codex_stop_hook_*.py'
      - 'tests/test_codex_install.py'
      - '.github/workflows/codex-macos.yml'

permissions:
  contents: read

jobs:
  stop-hook:
    runs-on: macos-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Check native temporary files, capture workers, and installer paths
        run: uv run --no-project --with pytest python -m pytest tests/test_codex_stop_hook_tmpfile.py tests/test_codex_stop_hook_utf8.py tests/test_codex_install.py -q
