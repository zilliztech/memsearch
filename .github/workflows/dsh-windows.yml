name: DSH Windows runtime

on:
  pull_request:
    paths:
      - 'plugins/dsh/**'
      - 'plugins/opencode/derive-collection.ts'
      - 'plugins/*/scripts/derive-collection.sh'
      - 'plugins/_shared/scripts/maintenance-runner.py'
      - 'src/memsearch/_maintenance_lock.py'
      - 'tests/test_maintenance_lock.py'
      - '.github/workflows/dsh-windows.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/dsh/**'
      - 'plugins/opencode/derive-collection.ts'
      - 'plugins/*/scripts/derive-collection.sh'
      - 'plugins/_shared/scripts/maintenance-runner.py'
      - 'src/memsearch/_maintenance_lock.py'
      - 'tests/test_maintenance_lock.py'
      - '.github/workflows/dsh-windows.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Install plugin runtime dependencies
        working-directory: plugins/dsh
        run: npm install --omit=peer --ignore-scripts --package-lock=false
      - name: Check native command launching
        run: node --test plugins/dsh/tests/runtime.test.js plugins/dsh/tests/skill-paths.test.js
      - name: Select Git Bash for collection parity
        shell: pwsh
        run: |
          $gitBashDirectory = Join-Path $env:ProgramFiles 'Git\bin'
          if (!(Test-Path (Join-Path $gitBashDirectory 'bash.exe'))) { throw 'Git Bash is required for collection parity' }
          $gitBashDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check shared collection names and startup reindexing
        run: node --experimental-strip-types --test plugins/dsh/tests/derive-collection.test.js
      - name: Check Python encoding and process handoff
        run: uv run --no-project --with pytest --with filelock --with psutil python -m pytest plugins/dsh/tests/test_runtime.py tests/test_maintenance_lock.py -q
      - name: Check compressed and plain session transcripts
        run: uv run --no-project --with pytest --with zstandard python -m pytest plugins/dsh/tests/test_parse_transcript.py -q
