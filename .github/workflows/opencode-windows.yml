name: OpenCode Windows runtime

on:
  pull_request:
    paths:
      - 'plugins/opencode/**'
      - 'tests/test_opencode_turns.py'
      - '.github/workflows/opencode-windows.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: npm install --ignore-scripts --package-lock=false
        working-directory: plugins/opencode
      - name: Check CLI discovery, collection naming and scoped recall tools
        working-directory: plugins/opencode
        run: |
          uv run --project ../.. node --test runtime.test.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --project ../.. node --test --test-name-pattern="tools recover before recall" index.test.ts
      - name: Check capture, recovery and process locks
        run: >-
          uv run python -m pytest -q tests/test_opencode_turns.py
          -k "two_capture_instances or append_survives or recall_queries_serialize or lock_released_on_process_exit"
